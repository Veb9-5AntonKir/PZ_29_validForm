<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Учебная форма авторизации NOVA SPACE" />
    <title>ПЗ 29 — NOVA SPACE</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles/style.css" />
    <script src="./scripts/app.js" defer></script>
  </head>
  <body>
    <div class="page">
      <main class="auth">
        <div class="auth__top">
          <div class="brand brand--mobile">
            <span class="brand__mark">N</span><span>NOVA SPACE</span>
          </div>
        </div>
        <section class="auth-card">
 <div class="auth-card">
  <div class="logo">N</div>
  <h1 class="title">С возвращением!</h1>
  <p class="subtitle">Введите данные, чтобы продолжить обучение.</p>

  <form class="auth-form">
    <div class="form-group">
      <label for="email">Электронная почта</label>
      <input type="email" id="email" placeholder="student@example.com" required>
    </div>
    <div class="form-group">
      <label for="password">Пароль</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Не менее 8 символов" required>
        <button type="button" class="toggle-password">Показать</button>
      </div>
      <span class="input-hint">Не менее 8 символов, включая букву и цифру.</span>
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="remember">
      <label for="remember">Запомнить меня</label>
    </div>
    <button type="submit" class="submit-btn">
      ВОЙТИ В АККАУНТ <span class="arrow">&rarr;</span>
    </button>
  </form>
</div>
        </section>
      </main>
    </div>
  </body>
</html>
